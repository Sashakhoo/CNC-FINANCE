# Railway / Nixpacks build config.
# WeasyPrint needs native Pango/Cairo/GDK-Pixbuf shared libraries at runtime.
# We install them as Debian packages (aptPkgs) so they land on the standard
# loader path where WeasyPrint's ctypes lookups expect them.

[phases.setup]
aptPkgs = [
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libgdk-pixbuf-2.0-0",
  "libcairo2",
  "libffi-dev",
  "libharfbuzz0b",
  "fonts-dejavu-core",
  "shared-mime-info",
]

# Nixpacks auto-detects Python from the root requirements.txt and builds a
# venv on PATH. We only override the start command.
[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
