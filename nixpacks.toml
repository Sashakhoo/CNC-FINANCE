# Railway / Nixpacks build config.
# WeasyPrint needs native Pango/Cairo/GDK-Pixbuf libraries at runtime —
# these are not pip-installable, hence the nixPkgs list below.

[phases.setup]
nixPkgs = [
  "python312",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "libffi",
  "fontconfig",
  "harfbuzz",
  "gobject-introspection",
]

[phases.install]
cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install --upgrade pip && /opt/venv/bin/pip install -r backend/requirements.txt"]

[start]
cmd = "cd backend && /opt/venv/bin/uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000}"
